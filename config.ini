; Crypto price scraper configuration.
;
; Every setting here is optional -- the real defaults live in scraper/config.py,
; so this file documents the schema rather than defining it, and deleting a line
; restores its default. Relative paths resolve against the directory holding
; main.py, never the current working directory (Task Scheduler and cron both
; start the process somewhere else entirely).

[api]
; CoinGecko's keyless public endpoint. Used as a failover, not the primary:
; simple/price is cached server-side for one to two minutes, so it cannot carry
; a ten-second cadence. No API key is used by design.
base_url = https://api.coingecko.com/api/v3
vs_currency = usd

; These are sized for a ten-second slot, not a five-minute one. A /ticker/price
; response is under a kilobyte, so a long timeout spends the whole slot waiting
; before the first retry even begins. Note that urllib applies its timeout per
; socket operation rather than as a deadline, so one attempt can cost about
; twice this value.
timeout_seconds = 2.5
max_attempts = 2

; Failover venues get a single attempt. One that failed has already told you
; everything it can, and the next tick is ten seconds away -- a second attempt
; only pushes the next primary request late, and that row is lost for good.
failover_max_attempts = 1

; Backoff between attempts: 0.5s, 1.0s ... capped at backoff_max_seconds. Any
; backoff longer than about a second is a wasted slot.
backoff_initial_seconds = 0.5
backoff_multiplier = 2.0
backoff_max_seconds = 1.0

; A 429 carries Retry-After. Sleeping a long one would block several slots, and
; capping it while carrying on polling is what escalates a 429 into an 418 IP
; ban -- so the source is parked for the full interval instead and the loop
; keeps ticking. This caps only what is slept inside the tick; the sum of all
; sleeps in one tick is separately bounded by backoff_budget_seconds.
retry_after_cap_seconds = 2.0
backoff_budget_seconds = 3.0

; Sent explicitly: the urllib default (Python-urllib/3.14) is refused by some
; fronting CDNs.
user_agent = CryptoPriceScraper/1.0

[collection]
; The poll interval, in seconds. 10 = ten seconds, aligned to the wall-clock
; grid (00:00:00, 00:00:10, 00:00:20 UTC). Minimum 5.
;
; Only loop mode reads this. A scheduler cannot express a sub-minute cadence --
; cron floors at one minute and Task Scheduler refuses a sub-minute trigger
; outright -- so --once ignores it entirely and polls once per invocation.
; Run `python main.py` and leave it running.
poll_seconds = 10

; Failover, used only when Binance fails or omits a coin. These venues are much
; slower than Binance and, for CoinGecko, cached -- so a row from one of them
; is a real observation at a coarser resolution, which is why `source` is
; recorded on every row.
enable_failover = true
binance_base_url = https://api.binance.com
hyperliquid_url = https://api.hyperliquid.xyz/info

[storage]
data_dir = data

; true  = the zip replaces the source CSV (the intended behaviour)
; false = keep both the CSV and the zip
delete_source_csv = true

compresslevel = 9

; Retry delays for transient Windows sharing violations (WinError 32), applied
; when opening to append, when reading and when deleting. Harmless on Linux,
; where they never fire. Five attempts in under a second: these ride out a
; scanner's momentary claim on the file, they do not wait out a wedged editor,
; and at ten seconds the whole slot is only 10s long.
remove_retry_delays = 0.05,0.1,0.2,0.4

; How long to wait for the single-instance lock before giving up.
lock_wait_seconds = 10

[logging]
log_dir = logs
log_filename = scraper.log
console_level = INFO
; INFO rather than DEBUG: the per-tick success line is a debug detail now, and
; the loop logs a rolled-up summary every ten minutes instead. 144 summary
; lines a day says more than 8,640 "poll ok" lines did.
file_level = INFO
; 4 MiB x 10 is roughly 24 days of history. The old 1 MiB x 5 held about three
; days at ten-second polling, so a problem noticed on Monday had already
; rotated out. Larger files also shrink the window on the Windows rotation
; hazard, where a rename fails because something holds scraper.log open.
max_bytes = 4194304
backup_count = 10

; Ticker symbol = CoinGecko coin id.
;
; The key becomes the filename suffix (2026-09-27_BTC.csv) and the value is the
; id used in the CoinGecko query. Adding a coin here starts a new CSV
; mid-day; removing one does not orphan its existing file, because the
; rollover scans the data directory rather than this list.
;
; Keys are matched case-insensitively, so "btc = bitcoin" and "BTC = bitcoin"
; in the same file is an error rather than a silent override.
[coins]
BTC  = bitcoin
ETH  = ethereum
HYPE = hyperliquid
