; Crypto price scraper configuration.
;
; Every setting here is optional -- the real defaults live in scraper/config.py,
; so this file documents the schema rather than defining it, and deleting a line
; restores its default. Relative paths resolve against the directory holding
; main.py, never the current working directory (Task Scheduler and cron both
; start the process somewhere else entirely).

[api]
; CoinGecko's keyless public endpoint. No API key is used by design.
base_url = https://api.coingecko.com/api/v3
vs_currency = usd

; One request must not be able to overrun the interval it belongs to.
timeout_seconds = 10
max_attempts = 3

; Backoff between attempts: 1s, 2s, 4s ... capped at backoff_max_seconds.
backoff_initial_seconds = 1.0
backoff_multiplier = 2.0
backoff_max_seconds = 10.0

; A 429 carries Retry-After. Honour it, but never sleep longer than this, and
; never let the sum of all sleeps in one tick exceed backoff_budget_seconds --
; a wedged tick would otherwise run into the next one.
retry_after_cap_seconds = 60.0
backoff_budget_seconds = 75.0

; Sent explicitly: the urllib default (Python-urllib/3.14) is refused by some
; fronting CDNs.
user_agent = CryptoPriceScraper/1.0

[collection]
; The poll interval, in seconds. 300 = every 5 minutes, aligned to the
; wall-clock grid (00:00, 00:05, 00:10 UTC). Minimum 10; below 60 logs a
; warning, because free tiers rate limit per IP and short intervals are the
; usual cause of 429s.
poll_seconds = 300

; Failover, used only when CoinGecko fails or omits a coin. Binance is tried
; first, then Hyperliquid for symbols Binance does not list (HYPE).
enable_failover = true
binance_base_url = https://api.binance.com
hyperliquid_url = https://api.hyperliquid.xyz/info

[storage]
data_dir = data

; true  = the zip replaces the source CSV (the intended behaviour)
; false = keep both the CSV and the zip
delete_source_csv = true

compresslevel = 9

; Retry delays for transient Windows sharing violations (WinError 32), applied
; when reading and when deleting. Harmless on Linux, where they never fire.
remove_retry_delays = 0.2,0.4,0.8,1.6

; How long to wait for the single-instance lock before giving up.
lock_wait_seconds = 10

[logging]
log_dir = logs
log_filename = scraper.log
console_level = INFO
file_level = DEBUG
max_bytes = 1048576
backup_count = 5

; Ticker symbol = CoinGecko coin id.
;
; The key becomes the filename suffix (2026-09-27_BTC.csv) and the value is the
; id used in the CoinGecko query. Adding a coin here starts a new CSV
; mid-day; removing one does not orphan its existing file, because the
; rollover scans the data directory rather than this list.
;
; Keys are matched case-insensitively, so "btc = bitcoin" and "BTC = bitcoin"
; in the same file is an error rather than a silent override.
[coins]
BTC  = bitcoin
ETH  = ethereum
HYPE = hyperliquid
